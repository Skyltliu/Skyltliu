<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="A beluga whale drifting through a Catppuccin Mocha reef">
  <title>A beluga whale drifting over the reef</title>

  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#181825"/>
      <stop offset="50%"  stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>

    <radialGradient id="moonglow" cx="50%" cy="0%" r="75%">
      <stop offset="0%"   stop-color="#cba6f7" stop-opacity="0.17"/>
      <stop offset="100%" stop-color="#cba6f7" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#b4befe" stop-opacity="0.17"/>
      <stop offset="100%" stop-color="#b4befe" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="38%"  stop-color="#eceffa"/>
      <stop offset="72%"  stop-color="#cdd6f4"/>
      <stop offset="100%" stop-color="#98a1c4"/>
    </linearGradient>

    <linearGradient id="kelp" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="#94e2d5"/>
      <stop offset="100%" stop-color="#a6e3a1"/>
    </linearGradient>

    <!-- fish, all drawn facing RIGHT; mirrored with scale(-1,1) when swimming left -->
    <g id="fish">
      <path d="M8,0 C8,-5 3,-8 -3,-8 C-9,-8 -13,-4 -13,0 C-13,4 -9,8 -3,8 C3,8 8,5 8,0 Z"/>
      <path d="M-12,0 L-22,-7 L-19,0 L-22,7 Z"/>
      <path d="M-3,-7 L-1,-13 L5,-6 Z"/>
      <path d="M-3,7 L-1,12 L5,6 Z"/>
      <circle cx="3" cy="-2" r="1.5" fill="#11111b"/>
    </g>

    <g id="tinyfish">
      <path d="M5,0 C5,-3 2,-5 -2,-5 C-6,-5 -8,-3 -8,0 C-8,3 -6,5 -2,5 C2,5 5,3 5,0 Z"/>
      <path d="M-7,0 L-13,-4 L-11,0 L-13,4 Z"/>
      <circle cx="2" cy="-1" r="0.9" fill="#11111b"/>
    </g>

    <g id="angel">
      <path d="M7,0 C7,-6 2,-12 -3,-12 C-9,-12 -12,-5 -12,0 C-12,5 -9,12 -3,12 C2,12 7,6 7,0 Z"/>
      <path d="M-11,0 L-20,-9 L-17,0 L-20,9 Z"/>
      <path d="M-3,-11 L1,-21 L6,-8 Z"/>
      <path d="M-3,11 L1,21 L6,8 Z"/>
      <circle cx="2" cy="-3" r="1.4" fill="#11111b"/>
    </g>

    <g id="jelly">
      <path d="M-15,0 C-15,-13 -8,-20 0,-20 C8,-20 15,-13 15,0 C11,-3 6,1 0,1 C-6,1 -11,-3 -15,0 Z"/>
      <g fill="none" stroke-width="1.5" stroke-linecap="round" opacity="0.55">
        <path d="M-10,0 C-12,9 -8,15 -10,24"/>
        <path d="M-3,1 C-5,11 -1,17 -3,27"/>
        <path d="M3,1 C5,11 1,17 3,27"/>
        <path d="M10,0 C12,9 8,15 10,24"/>
      </g>
    </g>

    <!-- branching coral, grows upward from its own origin -->
    <g id="coral" fill="none" stroke-width="5" stroke-linecap="round">
      <path d="M0,0 L0,-16"/>
      <path d="M0,-7  C-6,-13 -10,-19 -11,-28"/>
      <path d="M0,-9  C6,-15 10,-21 11,-30"/>
      <path d="M0,-15 C-3,-23 -4,-29 -2,-37"/>
      <path d="M0,-15 C4,-23 6,-28 6,-35"/>
      <path d="M-8,-22 C-12,-27 -15,-30 -18,-33"/>
      <path d="M8,-24 C12,-29 15,-32 18,-35"/>
    </g>

    <!-- keeps highlight, ridge and crease from spilling past the silhouette -->
    <clipPath id="bodyclip">
      <path d="M32,-29 C48,-28 60,-22 66,-13 C70,-8 71,-3 69,1 C67,5 63,7 58,8
               C61,10 63,12 62,14 C61,17 56,19 50,20 C39,24 20,27 2,27
               C-20,27 -42,22 -57,13 C-65,8 -71,3 -72,1 C-72,-1 -68,-5 -61,-10
               C-47,-19 -24,-26 0,-28 C10,-29 24,-29.5 32,-29 Z"/>
    </clipPath>

    <g id="fan" fill="none" stroke-width="2.2" stroke-linecap="round">
      <path d="M0,0 C-2,-10 -3,-18 -2,-26"/>
      <path d="M-2,-8 C-8,-14 -12,-19 -14,-26"/>
      <path d="M-2,-8 C4,-14 9,-19 11,-26"/>
      <path d="M-2,-16 C-7,-22 -10,-27 -11,-33"/>
      <path d="M-2,-16 C3,-22 7,-27 8,-33"/>
      <path d="M-2,-22 C-4,-28 -5,-32 -5,-36"/>
      <path d="M-2,-22 C0,-28 2,-32 3,-37"/>
    </g>
  </defs>

  <style>
    .sway, .bob, .fluke, .flip, .bub, .glim, .tent, .pulse { transform-box: fill-box; }

    .swim    { animation: swim 30s linear infinite; }
    .bob     { animation: bob 4.6s ease-in-out infinite; }
    .fluke   { animation: fluke 1.9s ease-in-out infinite; transform-origin: 100% 50%; }
    .flip    { animation: flip 2.8s ease-in-out infinite; transform-origin: 92% 12%; }
    .sway    { animation: sway 6s ease-in-out infinite;  transform-origin: 50% 100%; }
    .tent    { animation: tent 4.2s ease-in-out infinite; transform-origin: 50% 100%; }
    .bub     { animation: rise 7.5s ease-in infinite; }
    .glim    { animation: glim 5s ease-in-out infinite; }
    .pulse   { animation: pulse 3.6s ease-in-out infinite; transform-origin: 50% 20%; }

    .driftL  { animation: driftL 21s linear infinite; }
    .driftL2 { animation: driftL 27s linear infinite; animation-delay: -9s; }
    .school  { animation: driftR 25s linear infinite; }
    .driftR2 { animation: driftR 33s linear infinite; animation-delay: -14s; }
    .jellyup { animation: jellyup 23s linear infinite; }

    @keyframes swim    { from { transform: translateX(-240px); } to { transform: translateX(1140px); } }
    @keyframes bob     { 0%,100% { transform: translateY(0); }   50% { transform: translateY(-12px); } }
    @keyframes fluke   { 0%,100% { transform: rotate(-12deg); }  50% { transform: rotate(12deg); } }
    @keyframes flip    { 0%,100% { transform: rotate(-8deg); }   50% { transform: rotate(15deg); } }
    @keyframes sway    { 0%,100% { transform: rotate(-4.5deg); } 50% { transform: rotate(4.5deg); } }
    @keyframes tent    { 0%,100% { transform: rotate(-7deg); }   50% { transform: rotate(7deg); } }
    @keyframes glim    { 0%,100% { opacity: .25; }               50% { opacity: .7; } }
    @keyframes pulse   { 0%,100% { transform: scale(1, 1); }     50% { transform: scale(1.1, .88); } }
    @keyframes rise    { 0%   { transform: translateY(0) scale(.5); opacity: 0; }
                         15%  { opacity: .75; }
                         100% { transform: translateY(-165px) scale(1.15); opacity: 0; } }
    @keyframes driftL  { from { transform: translateX(1000px); } to { transform: translateX(-100px); } }
    @keyframes driftR  { from { transform: translateX(-100px); } to { transform: translateX(1000px); } }
    @keyframes jellyup { 0%   { transform: translate(120px, 300px); }
                         100% { transform: translate(300px, -60px); } }

    .d1 { animation-delay: -1.5s } .d2 { animation-delay: -3s }   .d3 { animation-delay: -4.5s }
    .d4 { animation-delay: -6s }   .d5 { animation-delay: -2.2s } .d6 { animation-delay: -3.7s }
    .d7 { animation-delay: -0.8s } .d8 { animation-delay: -5.2s } .d9 { animation-delay: -2.9s }

    @media (prefers-reduced-motion: reduce) {
      .swim, .bob, .fluke, .flip, .sway, .tent, .bub, .glim, .pulse,
      .driftL, .driftL2, .school, .driftR2, .jellyup { animation: none; }
    }
  </style>

  <rect width="900" height="280" rx="10" fill="url(#sea)"/>
  <rect width="900" height="280" rx="10" fill="url(#moonglow)"/>

  <!-- shafts of light from the surface -->
  <g>
    <polygon class="glim"    points="120,0 190,0 130,280 60,280"  fill="url(#ray)"/>
    <polygon class="glim d5" points="420,0 470,0 430,280 370,280" fill="url(#ray)"/>
    <polygon class="glim d2" points="700,0 780,0 740,280 650,280" fill="url(#ray)"/>
  </g>

  <!-- drifting motes -->
  <g fill="#b4befe">
    <circle class="glim"    cx="90"  cy="52"  r="1.6"/>
    <circle class="glim d5" cx="250" cy="34"  r="1.2"/>
    <circle class="glim d2" cx="470" cy="66"  r="1.7"/>
    <circle class="glim d6" cx="640" cy="40"  r="1.3"/>
    <circle class="glim d3" cx="810" cy="70"  r="1.5"/>
    <circle class="glim d1" cx="350" cy="96"  r="1.2"/>
    <circle class="glim d8" cx="560" cy="120" r="1.4"/>
    <circle class="glim d4" cx="180" cy="140" r="1.1"/>
  </g>

  <!-- jellyfish rising on a long slow diagonal -->
  <g class="jellyup">
    <g class="pulse"><use href="#jelly" fill="#cba6f7" stroke="#cba6f7" opacity="0.62" transform="scale(0.9)"/></g>
  </g>

  <!-- angelfish, heading left -->
  <g class="driftL2"><g transform="translate(0,88)"><g transform="scale(-0.85,0.85)">
    <use href="#angel" fill="#f9e2af"/>
  </g></g></g>

  <!-- lone fish, heading left -->
  <g class="driftL"><g transform="translate(0,196)"><g transform="scale(-0.8,0.8)">
    <use href="#fish" fill="#f5c2e7"/>
  </g></g></g>

  <!-- lone fish, heading right -->
  <g class="driftR2"><g transform="translate(0,64)"><g transform="scale(0.72)">
    <use href="#fish" fill="#fab387"/>
  </g></g></g>

  <!-- a small school, heading right -->
  <g class="school">
    <g transform="translate(0,168)" fill="#89dceb">
      <use href="#tinyfish" x="0"   y="0"/>
      <use href="#tinyfish" x="-22" y="-11"/>
      <use href="#tinyfish" x="-20" y="12"/>
      <use href="#tinyfish" x="-42" y="2"/>
      <use href="#tinyfish" x="-44" y="-19"/>
      <use href="#tinyfish" x="-64" y="-8"/>
    </g>
  </g>

  <!-- sea floor -->
  <path d="M0,280 L0,246 C120,228 220,254 330,242 C450,229 560,256 690,240 C790,228 850,246 900,236 L900,280 Z" fill="#313244"/>
  <path d="M0,280 L0,262 C140,250 240,270 360,260 C500,248 600,268 720,258 C820,250 860,264 900,256 L900,280 Z" fill="#45475a" opacity="0.5"/>

  <!-- corals and fans along the floor -->
  <g stroke="#cba6f7"><g class="sway"    transform="translate(206,252)"><use href="#coral"/></g></g>
  <g stroke="#f5c2e7"><g class="sway d5" transform="translate(482,250)"><use href="#coral" transform="scale(0.78)"/></g></g>
  <g stroke="#fab387"><g class="sway d2" transform="translate(628,254)"><use href="#coral" transform="scale(0.62)"/></g></g>
  <g stroke="#f38ba8"><g class="sway d7" transform="translate(112,258)"><use href="#fan"/></g></g>
  <g stroke="#94e2d5"><g class="sway d3" transform="translate(716,250)"><use href="#fan" transform="scale(0.85)"/></g></g>

  <!-- brain coral -->
  <g transform="translate(370,254)">
    <ellipse cx="0" cy="0" rx="26" ry="16" fill="#89b4fa" opacity="0.72"/>
    <g fill="none" stroke="#1e1e2e" stroke-width="1.6" opacity="0.5" stroke-linecap="round">
      <path d="M-18,-3 C-12,-9 -6,-1 0,-7 C6,-12 12,-4 18,-8"/>
      <path d="M-19,4 C-13,-2 -7,6 -1,0 C5,-5 12,3 18,-1"/>
      <path d="M-14,10 C-8,5 -2,12 4,7 C9,3 13,8 17,6"/>
    </g>
  </g>

  <!-- anemones -->
  <g transform="translate(534,256)">
    <g class="tent">
      <g fill="none" stroke="#f5c2e7" stroke-width="2.3" stroke-linecap="round" opacity="0.9">
        <path d="M-9,0 C-13,-6 -15,-11 -14,-17"/>
        <path d="M-4,-1 C-7,-8 -8,-14 -6,-20"/>
        <path d="M1,-1 C1,-9 2,-15 4,-21"/>
        <path d="M6,0 C8,-7 11,-12 14,-17"/>
        <path d="M10,1 C14,-4 18,-8 21,-11"/>
      </g>
    </g>
    <ellipse cx="0" cy="3" rx="12" ry="6" fill="#cba6f7" opacity="0.85"/>
  </g>

  <g transform="translate(880,248)">
    <g class="tent d3">
      <g fill="none" stroke="#94e2d5" stroke-width="2" stroke-linecap="round" opacity="0.85">
        <path d="M-7,0 C-11,-5 -12,-9 -11,-14"/>
        <path d="M-2,-1 C-5,-7 -5,-12 -3,-16"/>
        <path d="M3,-1 C3,-8 4,-12 6,-17"/>
        <path d="M8,0 C11,-5 14,-9 16,-13"/>
      </g>
    </g>
    <ellipse cx="0" cy="2" rx="10" ry="5" fill="#89dceb" opacity="0.8"/>
  </g>

  <g transform="translate(452,262)">
    <g class="tent d6">
      <g fill="none" stroke="#a6e3a1" stroke-width="1.9" stroke-linecap="round" opacity="0.8">
        <path d="M-6,0 C-9,-4 -10,-8 -9,-12"/>
        <path d="M-1,-1 C-3,-6 -3,-10 -1,-14"/>
        <path d="M4,0 C5,-5 7,-9 9,-12"/>
      </g>
    </g>
    <ellipse cx="0" cy="2" rx="8" ry="4.5" fill="#a6e3a1" opacity="0.7"/>
  </g>

  <!-- kelp -->
  <g stroke="url(#kelp)" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.85">
    <path class="sway"    d="M70,262  C58,230 82,206 68,174  C58,150 76,132 70,112"/>
    <path class="sway d1" d="M150,268 C140,242 160,222 150,196 C142,176 156,160 150,144"/>
    <path class="sway d2" d="M760,264 C748,234 772,212 758,182 C748,160 766,142 760,124"/>
    <path class="sway d3" d="M840,270 C830,246 848,226 838,200 C830,180 844,166 838,150"/>
    <path class="sway d4" d="M300,272 C292,252 306,236 298,216 C292,200 302,190 298,178"/>
    <path class="sway d6" d="M556,266 C546,242 562,224 552,200 C544,182 556,170 552,156"/>
    <path class="sway d8" d="M414,274 C406,256 418,242 410,224"/>
    <path class="sway d9" d="M672,268 C662,246 676,230 668,208 C662,192 672,182 668,170"/>
  </g>

  <!-- starfish -->
  <g transform="translate(258,266) rotate(-12)" fill="#fab387" opacity="0.9">
    <path d="M0,-11 L3.2,-3.4 L11,-3.4 L4.8,1.4 L7.2,9 L0,4.4 L-7.2,9 L-4.8,1.4 L-11,-3.4 L-3.2,-3.4 Z"/>
  </g>
  <g transform="translate(806,258) rotate(20)" fill="#f38ba8" opacity="0.8">
    <path d="M0,-8 L2.3,-2.5 L8,-2.5 L3.5,1 L5.2,6.5 L0,3.2 L-5.2,6.5 L-3.5,1 L-8,-2.5 L-2.3,-2.5 Z"/>
  </g>

  <!-- rising bubbles -->
  <g fill="none" stroke="#89dceb" stroke-width="1.4" opacity="0.65">
    <circle class="bub"    cx="120" cy="252" r="3.4"/>
    <circle class="bub d1" cx="136" cy="258" r="2.2"/>
    <circle class="bub d2" cx="756" cy="254" r="3"/>
    <circle class="bub d3" cx="772" cy="260" r="2"/>
    <circle class="bub d4" cx="300" cy="262" r="2.6"/>
    <circle class="bub d6" cx="492" cy="256" r="2.4"/>
    <circle class="bub d8" cx="640" cy="260" r="1.9"/>
  </g>

  <!-- the beluga -->
  <g class="swim">
    <g transform="translate(0,132)">
      <g class="bob">
        <g transform="scale(1.05)">

          <!-- fluke: long swept lobes off a slim peduncle with a deep median
               notch — a whale's flukes, not a fish's vertical caudal fin -->
          <g class="fluke">
            <g transform="rotate(16 -60 0)">
            <path d="M-60,-4
                     C-73,-7 -87,-13 -98,-19
                     C-104,-22 -109,-21 -109,-17
                     C-109,-12 -104,-7 -97,-2
                     C-95,-1 -94,0 -93,0
                     C-94,0 -95,1 -97,2
                     C-104,7 -109,12 -109,17
                     C-109,21 -104,22 -98,19
                     C-87,13 -73,7 -60,4 Z" fill="#aeb7d6"/>
            </g>
          </g>

          <!-- far pectoral flipper -->
          <g class="flip">
            <path d="M16,14 C12,24 2,31 -7,30 C-12,29 -11,25 -6,21 C1,16 8,13 16,14 Z" fill="#8b94b7"/>
          </g>

          <!-- body: teardrop — big bulbous melon over a short blunt beak,
               widest just behind the head, long taper to a slim peduncle -->
          <path d="M32,-29 C48,-28 60,-22 66,-13 C70,-8 71,-3 69,1 C67,5 63,7 58,8
                   C61,10 63,12 62,14 C61,17 56,19 50,20 C39,24 20,27 2,27
                   C-20,27 -42,22 -57,13 C-65,8 -71,3 -72,1 C-72,-1 -68,-5 -61,-10
                   C-47,-19 -24,-26 0,-28 C10,-29 24,-29.5 32,-29 Z" fill="url(#body)"/>

          <g clip-path="url(#bodyclip)">
            <!-- dorsal ridge: belugas carry a low bumpy ridge, never a fin -->
            <path d="M2,-27 C-4,-25.5 -9,-27 -15,-25 C-21,-23 -26,-24 -32,-21
                     C-36,-19 -40,-19.5 -44,-17"
                  stroke="#9aa3c6" stroke-width="1.7" fill="none" stroke-linecap="round" opacity="0.28"/>

            <!-- neck crease: belugas can turn their heads -->
            <path d="M30,-28 C25,-19 25,-6 30,5" stroke="#aab3d2" stroke-width="1.2"
                  fill="none" opacity="0.26" stroke-linecap="round"/>

            <!-- melon highlight -->
            <ellipse cx="44" cy="-19" rx="15" ry="6" transform="rotate(-20 44 -19)"
                     fill="#ffffff" opacity="0.4"/>
          </g>

          <!-- blowhole: a single crescent on the crown, behind the melon -->
          <path d="M11,-26.4 C14,-29.4 23,-29.4 26,-26.4 C23,-27.9 14,-27.9 11,-26.4 Z"
                fill="#6b7396" opacity="0.9"/>

          <!-- near pectoral flipper, tip curling up as in adults -->
          <g class="flip">
            <path d="M22,15 C18,26 7,33 -2,32 C-8,31 -7,26 -1,22 C6,17 14,14 22,15 Z" fill="#b6bfdd"/>
          </g>

          <!-- eye, set just behind the corner of the mouth -->
          <circle cx="53" cy="-2" r="2.4" fill="#11111b"/>
          <circle cx="53.8" cy="-2.9" r="0.8" fill="#ffffff" opacity="0.85"/>

          <!-- long mouth line, upturned at the corner -->
          <path d="M61,13 C55,16 48,18 42,17.5 C40,17.2 38.5,16.4 37.5,15.2"
                stroke="#7f88ab" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.6"/>

          <!-- spout from the blowhole -->
          <g fill="none" stroke="#89dceb" stroke-width="1.3" opacity="0.7">
            <circle class="bub"    cx="18" cy="-31" r="2.4"/>
            <circle class="bub d2" cx="24" cy="-33" r="1.6"/>
          </g>

        </g>
      </g>
    </g>
  </g>

</svg>
